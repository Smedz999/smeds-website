<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#2563eb"/>
  
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
  
  <!-- Circular Arrow Element -->
  <path d="M 250 80 A 170 170 0 1 1 100 280" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <polygon points="85,265 115,295 75,305" fill="white" opacity="0.9"/>
  
  <!-- Inner Circle for text background -->
  <circle cx="250" cy="250" r="140" fill="white" opacity="0.1"/>
  
  <!-- HJS Text -->
  <text x="250" y="260" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8">HJS</text>
  
  <!-- group. Text -->
  <text x="250" y="330" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="300" fill="white" text-anchor="middle" letter-spacing="6" opacity="0.95">group.</text>
  
  <!-- Decorative dots -->
  <circle cx="250" cy="160" r="6" fill="white" opacity="0.6"/>
  <circle cx="250" cy="360" r="6" fill="white" opacity="0.6"/>
</svg>